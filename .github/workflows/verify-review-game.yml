name: Verify mystery door
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-mystery-door.ts'
      - 'scripts/check-review-import.ts'
      - 'scripts/check-review-exchange.ts'
      - 'scripts/check-review-choices.ts'
      - 'src/utils/reviewQuestionChoices.ts'
      - 'src/utils/reviewBankExchange.ts'
      - 'package.json'
      - '.github/workflows/verify-review-game.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:mystery
      - run: npx tsx scripts/check-review-import.ts
      - run: npx tsx scripts/check-review-exchange.ts
      - run: npx tsx scripts/check-review-choices.ts
      - run: npm run build
